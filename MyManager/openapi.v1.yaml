openapi: '3.2.0'
info:
  title: MyManager | v1
  version: 1.0.0
servers:
  - url: http://localhost:5275
paths:
  /home:
    get:
      tags:
        - HomeEndpoint
      responses:
        '200':
          description: OK
  '/api/project-board/boards/{boardId}':
    get:
      tags:
        - Boards
      summary: Get a board by ID
      operationId: GetBoardById
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBoardByIdResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - Boards
      summary: Deletes an existing board
      operationId: DeleteBoard
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      tags:
        - Boards
      summary: Updates an existing board
      operationId: UpdateBoard
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardRequestBody'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBoardResponse'
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/project-board/boards/{boardId}-{slug}':
    get:
      tags:
        - Boards
      summary: Gets a board by slug and ID
      operationId: GetBoardBySlug
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBoardBySlugResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/project-board/boards:
    get:
      tags:
        - Boards
      summary: List boards
      operationId: ListBoards
      parameters:
        - name: Name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListBoardsResponse'
    post:
      tags:
        - Boards
      summary: Creates a new board
      operationId: CreateBoard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardRequestBody'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBoardResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/project-board/boards/{boardId}/cards/{cardId}':
    get:
      tags:
        - Cards
      summary: Get a card from a board by ID
      operationId: GetCard
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
        - name: cardId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCardByIdResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/project-board/{boardId}/cards':
    get:
      tags:
        - Cards
      summary: List cards of a board
      operationId: ListCards
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListCardsResponse'
  '/api/project-board/boards/{boardId}/columns/{columnId}':
    get:
      tags:
        - Columns
      summary: Get a column by its ID
      operationId: GetColumnById
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
        - name: columnId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetColumnByIdResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - Columns
      summary: Delete a column from its board
      operationId: DeleteColumn
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
        - name: columnId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteColumnResponse'
        '404':
          description: Not Found
        '409':
          description: Conflict
    patch:
      tags:
        - Columns
      summary: Updates an existing column for a board
      operationId: UpdateColumn
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
        - name: columnId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateColumnRequestBody'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateColumnResponse'
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/project-board/boards/{boardId}/columns':
    get:
      tags:
        - Columns
      summary: List columns for a board
      operationId: ListColumns
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListColumnsResponse'
    post:
      tags:
        - Columns
      summary: Creates a new column for a project board.
      operationId: CreateColumn
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColumnBody'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateColumnResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    CreateBoardRequestBody:
      required:
        - name
      type: object
      properties:
        name:
          type: string
        description:
          type:
            - 'null'
            - string
    CreateBoardResponse:
      required:
        - boardId
        - name
        - slug
        - description
        - createdAt
      type: object
      properties:
        boardId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        name:
          type: string
        slug:
          type: string
        description:
          type:
            - 'null'
            - string
        createdAt:
          type: string
          format: date-time
    CreateColumnBody:
      required:
        - name
      type: object
      properties:
        name:
          type: string
    CreateColumnResponse:
      required:
        - columnId
        - boardId
        - boardSlug
        - name
        - createdAt
      type: object
      properties:
        columnId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        boardId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        boardSlug:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    DeleteColumnResponse:
      required:
        - boardId
        - columnId
        - name
        - modifiedAt
      type: object
      properties:
        boardId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        columnId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        name:
          type: string
        modifiedAt:
          type: string
          format: date-time
    GetBoardByIdResponse:
      required:
        - boardId
        - name
        - slug
        - description
        - createdAt
        - modifiedAt
      type: object
      properties:
        boardId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        name:
          type: string
        slug:
          type: string
        description:
          type:
            - 'null'
            - string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    GetBoardBySlugResponse:
      required:
        - boardId
        - name
        - slug
        - description
        - createdAt
        - modifiedAt
      type: object
      properties:
        boardId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        name:
          type: string
        slug:
          type: string
        description:
          type:
            - 'null'
            - string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    GetCardByIdResponse:
      required:
        - name
        - description
        - createdAt
        - modifiedAt
      type: object
      properties:
        name:
          type: string
        description:
          type:
            - 'null'
            - string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    GetColumnByIdResponse:
      required:
        - columnId
        - boardId
        - name
        - modifiedAt
      type: object
      properties:
        columnId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        boardId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        name:
          type: string
        modifiedAt:
          type: string
          format: date-time
    ListBoardsResponse:
      required:
        - boardId
        - name
        - slug
        - createdAt
        - modifiedAt
      type: object
      properties:
        boardId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    ListCardsResponse:
      required:
        - cardId
        - boardId
        - name
        - description
        - createdAt
        - modifiedAt
      type: object
      properties:
        cardId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        boardId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        name:
          type: string
        description:
          type:
            - 'null'
            - string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    ListColumnsResponse:
      required:
        - columnId
        - name
      type: object
      properties:
        columnId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        name:
          type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
    UpdateBoardRequestBody:
      type: object
      properties:
        name:
          type:
            - 'null'
            - string
        description:
          type:
            - 'null'
            - string
    UpdateBoardResponse:
      required:
        - boardId
        - name
        - slug
        - modifiedAt
      type: object
      properties:
        boardId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        name:
          type: string
        slug:
          type: string
        modifiedAt:
          type: string
          format: date-time
    UpdateColumnRequestBody:
      required:
        - name
      type: object
      properties:
        name:
          type:
            - 'null'
            - string
    UpdateColumnResponse:
      required:
        - boardId
        - columnId
        - name
        - modifiedAt
      type: object
      properties:
        boardId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        columnId:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        name:
          type: string
        modifiedAt:
          type: string
          format: date-time
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
tags:
  - name: Boards
  - name: Cards
  - name: Columns
  - name: HomeEndpoint
